  rayrope_freq_base: 3.0
  rayrope_disable_vo: false
  rayrope_equal_ray_thirds: false
  rayrope_ray_uv_num_freqs: 3
  rayrope_ray_depth_num_freqs: 2
  rayrope_frequency_profile: vanilla
  rayrope_init_depth: 0.0
  rayrope_init_sigma: 3.0
  rayrope_undo_urope_camera_flip: true
  rayrope_normalize_unit_baseline: true
