acc: 1
amp: true
amp_dtype: fp16
aug_with_world_origin_shift: false
aug_with_world_rotation: false
auto_resume: false
check_nan_in_params: false
ckpt_every: 1000
ckpt_keeps: 3
ckpt_subdir: ckpts
dataset_batch_scenes: 8
dataset_name: realestate10k
dataset_patch_size: 256
dataset_supervise_views: 1
fixed_seed: true
grad_clip: 0.0
lr: 0.0004
max_steps: 80000
model_config:
  cam_shape:
  - 256
  - 256
  - 6
  encoder:
    checkpointing: false
    input_norm: true
    layer:
      activation: torch.nn.functional.relu
      batch_first: true
      bias: false
      d_model: 768
      dim_feedforward: 1024
      dropout: 0.0
      elementwise_affine: true
      layer_norm_eps: 1.0e-05
      modulation_activation: null
      nhead: 16
      norm_first: true
      norm_type: layer_norm
      qk_norm: true
    num_layers: 6
    output_norm: true
  img_shape:
  - 256
  - 256
  - 3
  patch_size: 8
  pos_enc: urope
  ray_encoding: camray
  ref_views: 2
  tar_views: 1
  urope_max_depth: 20.0
  urope_min_depth: 2.0
only_model: false
output_dir: results/worldrope
perceptual_loss_w: 0.5
print_every: 100
random_zoom: false
render_video: false
render_views: false
resume: null
seed: 42
stats_subdir: stats
test_every: 8000
test_index_fp: null
test_input_views: 2
test_n: null
test_only: false
test_subdir: tests
test_supervise_views: 3
test_zoom_factor:
- 1.0
train_zoom_factor: 1.0
use_torch_compile: true
visual_every: 100
visual_subdir: visuals
warmup_steps: 2500
